<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Triết học Mác – Lênin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e4e0d6;
  --brand:#b3261e; --brand-soft:#fbeae8; --ok:#1e7a46; --ok-soft:#e5f4eb; --bad:#c0392b; --bad-soft:#fdecea;
  --accent:#2c5aa0; --accent-soft:#e8eef8; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2125; --ink:#e8e6e1; --muted:#9aa1aa; --line:#30343a;
  --brand:#ef6b5f; --brand-soft:#3a2220; --ok:#5cc48a; --ok-soft:#1c3226; --bad:#f07a6c; --bad-soft:#3a2321;
  --accent:#7ea6e6; --accent-soft:#1f2a3b; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo span.dot{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px}
main{padding:24px 0 60px}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:20px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:1fr 1fr}
@media(max-width:640px){.grid.two{grid-template-columns:1fr}}
.mode{cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;color:inherit;width:100%}
.mode:hover{border-color:var(--brand);transform:translateY(-2px)}
.mode .ic{font-size:26px}
.mode h3{margin:8px 0 4px;font-size:18px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.pill b{color:var(--ink)}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
select,input[type=number],input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.qtext{font-size:18px;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.expl{margin-top:16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 16px}
.expl h4{margin:0 0 6px;font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.expl p{margin:0}
.verdict{font-weight:700;margin-bottom:4px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 16px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .2s}
.listq{display:flex;flex-direction:column;gap:12px}
.hidden{display:none!important}
/* exam */
#exam{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto}
.examtop{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:2}
.examtop .wrap{display:flex;align-items:center;gap:14px;height:58px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;background:var(--brand-soft);color:var(--brand);padding:4px 12px;border-radius:8px}
.timer.low{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:16px}
.palette button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;height:36px;font-size:13px;font-weight:600}
.palette button.done{background:var(--accent);border-color:var(--accent);color:#fff}
.palette button.cur{outline:2px solid var(--brand);outline-offset:1px}
.palette button.flag{box-shadow:inset 0 -4px 0 #e0a100}
.palette button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.palette button.w{background:var(--bad);border-color:var(--bad);color:#fff}
#fsgate{position:fixed;inset:0;background:rgba(10,10,12,.82);z-index:60;display:grid;place-items:center;padding:16px}
#fsgate .card{max-width:460px;text-align:center}
.warn{color:var(--bad);font-weight:600}
.score{font-size:48px;font-weight:700;color:var(--brand);line-height:1}
.empty{color:var(--muted);text-align:center;padding:30px}
mark{background:#ffe48a;color:inherit;border-radius:3px}
.kbd{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo" onclick="go('home')"><span class="dot">☭</span>Triết học Mác – Lênin</div>
  <div class="spacer"></div>
  <button class="iconbtn" onclick="toggleTheme()" title="Đổi giao diện sáng/tối">🌓 Giao diện</button>
</div></header>

<main class="wrap" id="app"></main>

<div id="exam" class="hidden"></div>
<div id="fsgate" class="hidden"></div>

<script src="data.js"></script>
<script>
const Q = window.QUESTIONS;
const CH = {1:"Chương 1: Khái luận về triết học và triết học Mác – Lênin",2:"Chương 2: Chủ nghĩa duy vật biện chứng",3:"Chương 3: Chủ nghĩa duy vật lịch sử"};
const L = "ABCD";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const store = {get(k,d){try{const v=localStorage.getItem("mln_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("mln_"+k,JSON.stringify(v))}catch(e){}}};
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* theme */
function applyTheme(t){document.documentElement.dataset.theme=t}
function toggleTheme(){const t=document.documentElement.dataset.theme==="dark"?"light":"dark";applyTheme(t);store.set("theme",t)}
applyTheme(store.get("theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));

/* progress of study: id -> 1 right / 0 wrong */
let seen = store.get("seen",{});
let wrongSet = new Set(store.get("wrong",[]));
function saveSeen(){store.set("seen",seen);store.set("wrong",[...wrongSet])}

function go(view){window.scrollTo(0,0);({home,studySetup,examSetup})[view]()}

function home(){
  const done=Object.keys(seen).length;
  $("#app").innerHTML=`
  <h1>Ôn tập & Kiểm tra</h1>
  <p class="sub">Ngân hàng ${Q.length} câu trắc nghiệm, chia theo 3 chương. Mỗi câu đều có giải thích lý thuyết.</p>
  <div class="grid two">
    <button class="card mode" onclick="go('studySetup')"><div class="ic">📖</div><h3>Ôn tập</h3><p>Làm từng câu, xem ngay đúng/sai và đọc giải thích lý thuyết. Có chế độ xem nhanh đáp án và ôn lại câu sai.</p></button>
    <button class="card mode" onclick="go('examSetup')"><div class="ic">📝</div><h3>Kiểm tra</h3><p>Đề ngẫu nhiên, tính giờ, làm bài ở chế độ toàn màn hình. Chấm điểm và xem lại chi tiết khi nộp bài.</p></button>
  </div>
  <div class="stats">
    ${[1,2,3].map(c=>`<span class="pill">Chương ${c}: <b>${Q.filter(q=>q.chapter===c).length}</b> câu</span>`).join("")}
    <span class="pill">Đã ôn: <b>${done}</b>/${Q.length}</span>
    <span class="pill">Câu đang sai: <b>${wrongSet.size}</b></span>
  </div>`;
}

/* ---------- STUDY ---------- */
let S={};
function chapterChips(sel){return `<div class="chips" id="chips">${[0,1,2,3].map(c=>`<button class="chip ${sel.includes(c)?"on":""}" data-c="${c}">${c?"Chương "+c:"Tất cả"}</button>`).join("")}</div>`}
function bindChips(){
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{
    const c=+b.dataset.c, all=document.querySelectorAll("#chips .chip");
    if(c===0){all.forEach(x=>x.classList.toggle("on",x.dataset.c==="0"))}
    else{all[0].classList.remove("on");b.classList.toggle("on");if(![...all].some(x=>x.classList.contains("on")))all[0].classList.add("on")}
  });
}
function chipVal(){const on=[...document.querySelectorAll("#chips .chip.on")].map(b=>+b.dataset.c);return on.includes(0)?[1,2,3]:on}

function studySetup(){
  $("#app").innerHTML=`
  <h1>Ôn tập</h1><p class="sub">Chọn phạm vi và cách ôn.</p>
  <div class="card">
    <label class="f">Phạm vi</label>${chapterChips([0])}
    <label class="f">Cách ôn</label>
    <select id="smode">
      <option value="quiz">Làm từng câu – trả lời rồi xem giải thích</option>
      <option value="read">Xem nhanh – hiện sẵn đáp án và giải thích</option>
      <option value="wrong">Ôn lại các câu đã làm sai (${wrongSet.size})</option>
    </select>
    <label class="f">Thứ tự</label>
    <select id="sorder"><option value="seq">Theo thứ tự</option><option value="rand">Ngẫu nhiên</option></select>
    <label class="f">Tìm kiếm (tùy chọn)</label>
    <input type="search" id="sq" placeholder="Nhập từ khóa, ví dụ: vật chất, ý thức, nhà nước…">
    <div class="row" style="margin-top:18px"><button class="btn" onclick="startStudy()">Bắt đầu ôn</button><button class="btn ghost" onclick="go('home')">Quay lại</button>
    ${Object.keys(seen).length?`<button class="btn ghost" onclick="if(confirm('Xóa toàn bộ tiến độ ôn tập?')){seen={};wrongSet.clear();saveSeen();studySetup()}">Xóa tiến độ</button>`:""}</div>
  </div>`;
  bindChips();
}
function startStudy(){
  const chs=chipVal(), mode=$("#smode").value, kw=$("#sq").value.trim().toLowerCase();
  let list=Q.filter(q=>chs.includes(q.chapter));
  if(mode==="wrong") list=list.filter(q=>wrongSet.has(q.id));
  if(kw) list=list.filter(q=>(q.q+" "+q.opts.join(" ")+" "+(q.ex||"")).toLowerCase().includes(kw));
  if($("#sorder").value==="rand") list=shuffle(list);
  if(!list.length){alert("Không có câu nào phù hợp.");return}
  S={list,i:0,mode,kw,ans:{}};
  mode==="read"?renderRead():renderStudy();
}
function hl(t){const s=md(t);if(!S.kw)return s;const re=new RegExp("("+S.kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");return s.replace(re,"<mark>$1</mark>")}
function explBox(q){return `<div class="expl"><h4>Giải thích lý thuyết</h4><p>${hl(q.ex||"Chưa có giải thích.")}</p></div>`}

function renderStudy(){
  const q=S.list[S.i], picked=S.ans[q.id], answered=picked!==undefined;
  const pct=Math.round((S.i+1)/S.list.length*100);
  $("#app").innerHTML=`
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="card">
    <div class="qmeta"><span>Câu ${S.i+1}/${S.list.length}</span><span class="tag">${q.id} · Chương ${q.chapter}</span></div>
    <p class="qtext">${hl(q.q)}</p>
    <div class="opts">${q.opts.map((o,k)=>{
      let c="";if(answered){if(k===q.ans)c="right";else if(k===picked)c="wrong"}
      return `<button class="opt ${c}" ${answered?"disabled":""} onclick="pickStudy(${k})"><span class="k">${L[k]}</span><span>${hl(o)}</span></button>`}).join("")}</div>
    ${answered?`<div style="margin-top:14px" class="verdict ${picked===q.ans?"ok":"no"}">${picked===q.ans?"✓ Chính xác!":"✗ Chưa đúng – đáp án đúng là "+L[q.ans]}</div>${explBox(q)}`:""}
    <div class="nav">
      <button class="btn ghost" ${S.i===0?"disabled":""} onclick="S.i--;renderStudy()">← Câu trước</button>
      <button class="btn ghost" onclick="go('studySetup')">Thoát</button>
      <button class="btn" onclick="nextStudy()">${S.i===S.list.length-1?"Hoàn thành":"Câu tiếp →"}</button>
    </div>
    <p class="kbd">Phím tắt: A/B/C/D hoặc 1–4 để chọn, ← → để chuyển câu.</p>
  </div>`;
}
function pickStudy(k){
  const q=S.list[S.i];if(S.ans[q.id]!==undefined)return;
  S.ans[q.id]=k;seen[q.id]=k===q.ans?1:0;
  if(k===q.ans)wrongSet.delete(q.id);else wrongSet.add(q.id);
  saveSeen();renderStudy();
}
function nextStudy(){
  if(S.i<S.list.length-1){S.i++;renderStudy();window.scrollTo(0,0);return}
  const n=Object.keys(S.ans).length,r=S.list.filter(q=>S.ans[q.id]===q.ans).length;
  $("#app").innerHTML=`<div class="card" style="text-align:center"><h2>Hoàn thành phiên ôn tập</h2>
  <div class="score">${r}/${n}</div><p class="sub">câu đúng trên số câu đã trả lời (tổng ${S.list.length} câu)</p>
  <div class="row" style="justify-content:center"><button class="btn" onclick="go('studySetup')">Ôn tiếp</button><button class="btn ghost" onclick="go('home')">Trang chủ</button></div></div>`;
}
function renderRead(){
  const N=30, start=S.i, page=S.list.slice(start,start+N), pages=Math.ceil(S.list.length/N), p=start/N+1;
  $("#app").innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Xem nhanh · ${S.list.length} câu</h2><button class="btn ghost" onclick="go('studySetup')">Thoát</button></div>
  <div class="listq">${page.map((q,j)=>`<div class="card">
    <div class="qmeta"><span>Câu ${start+j+1}</span><span class="tag">${q.id}</span></div>
    <p class="qtext">${hl(q.q)}</p>
    <div class="opts">${q.opts.map((o,k)=>`<div class="opt ${k===q.ans?"right":""}"><span class="k">${L[k]}</span><span>${hl(o)}</span></div>`).join("")}</div>
    ${explBox(q)}</div>`).join("")}</div>
  <div class="nav"><button class="btn ghost" ${p===1?"disabled":""} onclick="S.i-=${N};renderRead();scrollTo(0,0)">← Trang trước</button><span class="pill">Trang ${p}/${pages}</span><button class="btn ghost" ${p===pages?"disabled":""} onclick="S.i+=${N};renderRead();scrollTo(0,0)">Trang sau →</button></div>`;
}

/* ---------- EXAM ---------- */
let E=null, tick=null;
function examSetup(){
  $("#app").innerHTML=`
  <h1>Kiểm tra</h1><p class="sub">Bài kiểm tra bắt buộc làm ở chế độ <b>toàn màn hình</b>. Nếu thoát toàn màn hình, đồng hồ tạm khóa bài cho đến khi bạn quay lại; số lần thoát sẽ được ghi nhận.</p>
  <div class="card">
    <label class="f">Phạm vi</label>${chapterChips([0])}
    <div class="grid two">
      <div><label class="f">Số câu</label><select id="en">${[10,20,30,40,50,60].map(n=>`<option ${n===40?"selected":""}>${n}</option>`).join("")}</select></div>
      <div><label class="f">Thời gian (phút)</label><select id="et">${[10,15,20,30,45,60,90].map(n=>`<option ${n===45?"selected":""}>${n}</option>`).join("")}</select></div>
    </div>
    <label class="f"><input type="checkbox" id="eshuf" checked> Xáo trộn thứ tự phương án</label>
    <div class="row" style="margin-top:18px"><button class="btn" onclick="startExam()">Vào phòng thi (toàn màn hình)</button><button class="btn ghost" onclick="go('home')">Quay lại</button></div>
  </div>`;
  bindChips();
}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function reqFS(){const d=document.documentElement;const f=d.requestFullscreen||d.webkitRequestFullscreen;return f?Promise.resolve(f.call(d)).catch(()=>{throw 0}):Promise.reject()}
function startExam(){
  const chs=chipVal(), n=+$("#en").value, t=+$("#et").value, sh=$("#eshuf").checked;
  const pool=Q.filter(q=>chs.includes(q.chapter));
  const qs=shuffle(pool).slice(0,Math.min(n,pool.length)).map(q=>{
    const fixed=q.opts.some(o=>/tất cả|cả ba|cả 3|các (phương|đáp) án|(đáp|phương) án [a-d]\b|cả [a-d] và|^[a-d] và [a-d]/i.test(o));
    const order=sh&&!fixed?shuffle([0,1,2,3]):[0,1,2,3];
    return {...q,opts:order.map(k=>q.opts[k]),ans:order.indexOf(q.ans)};
  });
  E={qs,i:0,ans:{},flag:new Set(),end:Date.now()+t*60000,dur:t*60000,exits:0,done:false,paused:false};
  reqFS().then(()=>{openExam()}).catch(()=>{
    gate(`<h2>Cần bật toàn màn hình</h2><p>Trình duyệt chưa cho phép vào chế độ toàn màn hình. Hãy bấm nút dưới đây để bắt đầu.</p><button class="btn" onclick="reqFS().then(()=>{closeGate();openExam()}).catch(()=>alert('Trình duyệt này không hỗ trợ toàn màn hình. Hãy thử Chrome, Edge hoặc Firefox trên máy tính.'))">Bật toàn màn hình</button> <button class="btn ghost" onclick="closeGate();E=null">Hủy</button>`);
  });
}
function gate(h){$("#fsgate").innerHTML=`<div class="card">${h}</div>`;$("#fsgate").classList.remove("hidden")}
function closeGate(){$("#fsgate").classList.add("hidden")}
function openExam(){
  $("#exam").classList.remove("hidden");document.body.style.overflow="hidden";
  clearInterval(tick);tick=setInterval(updTimer,500);renderExam();
}
function onFSChange(){
  if(!E||E.done)return;
  if(!fsEl()){
    E.exits++;E.paused=true;E.pauseAt=Date.now();
    gate(`<h2>Bạn đã thoát toàn màn hình</h2><p class="warn">Lần thoát thứ ${E.exits}. Bài làm đang bị khóa.</p><p>Đồng hồ vẫn chạy. Quay lại toàn màn hình để tiếp tục làm bài${E.exits>=3?", hoặc nộp bài ngay":""}.</p>
    <div class="row" style="justify-content:center"><button class="btn" onclick="reqFS().then(()=>{E.paused=false;closeGate()}).catch(()=>{})">Quay lại làm bài</button><button class="btn ghost" onclick="closeGate();submitExam(true)">Nộp bài</button></div>`);
  }
}
document.addEventListener("fullscreenchange",onFSChange);document.addEventListener("webkitfullscreenchange",onFSChange);
document.addEventListener("visibilitychange",()=>{if(E&&!E.done&&document.hidden){E.tabs=(E.tabs||0)+1}});
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function updTimer(){
  if(!E||E.done)return;const left=E.end-Date.now();const el=$("#timer");
  if(el){el.textContent=fmt(left);el.classList.toggle("low",left<60000)}
  if(left<=0){closeGate();submitExam(true,true)}
}
function renderExam(){
  const q=E.qs[E.i], a=E.ans[q.id], n=Object.keys(E.ans).length;
  $("#exam").innerHTML=`
  <div class="examtop"><div class="wrap"><b>Bài kiểm tra</b><span class="pill">${n}/${E.qs.length} đã làm</span><div class="spacer"></div><span class="timer" id="timer">${fmt(E.end-Date.now())}</span><button class="btn" onclick="confirmSubmit()">Nộp bài</button></div></div>
  <div class="wrap" style="padding-top:20px;padding-bottom:40px">
    <div class="card">
      <div class="qmeta"><span>Câu ${E.i+1}/${E.qs.length}</span><button class="iconbtn" onclick="toggleFlag()">${E.flag.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu xem lại"}</button></div>
      <p class="qtext">${md(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${a===k?"sel":""}" onclick="pickExam(${k})"><span class="k">${L[k]}</span><span>${md(o)}</span></button>`).join("")}</div>
      <div class="nav"><button class="btn ghost" ${E.i===0?"disabled":""} onclick="E.i--;renderExam()">← Câu trước</button><button class="btn ghost" ${E.i===E.qs.length-1?"disabled":""} onclick="E.i++;renderExam()">Câu tiếp →</button></div>
      <div class="palette">${E.qs.map((x,j)=>`<button class="${E.ans[x.id]!==undefined?"done":""} ${j===E.i?"cur":""} ${E.flag.has(x.id)?"flag":""}" onclick="E.i=${j};renderExam()">${j+1}</button>`).join("")}</div>
    </div>
  </div>`;
}
function pickExam(k){if(E.paused)return;const q=E.qs[E.i];E.ans[q.id]=k;if(E.i<E.qs.length-1)setTimeout(()=>{E.i++;renderExam()},180);renderExam()}
function toggleFlag(){const id=E.qs[E.i].id;E.flag.has(id)?E.flag.delete(id):E.flag.add(id);renderExam()}
function confirmSubmit(){
  const left=E.qs.length-Object.keys(E.ans).length;
  gate(`<h2>Nộp bài?</h2><p>${left?`<span class="warn">Còn ${left} câu chưa làm.</span>`:"Bạn đã làm hết các câu."}</p><div class="row" style="justify-content:center"><button class="btn" onclick="closeGate();submitExam()">Nộp bài</button><button class="btn ghost" onclick="closeGate()">Làm tiếp</button></div>`);
}
function submitExam(force,timeout){
  if(!E||E.done)return;E.done=true;clearInterval(tick);
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  E.qs.forEach(q=>{const a=E.ans[q.id];if(a===undefined)return;seen[q.id]=a===q.ans?1:0;a===q.ans?wrongSet.delete(q.id):wrongSet.add(q.id)});saveSeen();
  const r=E.qs.filter(q=>E.ans[q.id]===q.ans).length, score=(r/E.qs.length*10).toFixed(2).replace(/\.?0+$/,"");
  const used=Math.min(E.dur,E.dur-(E.end-Date.now()));
  const hist=store.get("hist",[]);hist.unshift({d:Date.now(),r,n:E.qs.length,s:score});store.set("hist",hist.slice(0,20));
  E.view=-1;
  $("#exam").innerHTML=`
  <div class="examtop"><div class="wrap"><b>Kết quả</b><div class="spacer"></div><button class="btn ghost" onclick="closeExam()">Đóng</button></div></div>
  <div class="wrap" style="padding:20px 16px 40px">
    <div class="card" style="text-align:center">
      ${timeout?`<p class="warn">Hết giờ – bài đã được nộp tự động.</p>`:""}
      <div class="score">${score}<span style="font-size:22px;color:var(--muted)">/10</span></div>
      <p class="sub" style="margin:8px 0 0">Đúng <b>${r}</b>/${E.qs.length} câu · Thời gian ${fmt(used)} · Thoát toàn màn hình: ${E.exits} lần${E.tabs?` · Chuyển tab: ${E.tabs} lần`:""}</p>
      <div class="palette" style="max-width:520px;margin:16px auto 0">${E.qs.map((x,j)=>`<button class="${E.ans[x.id]===x.ans?"r":"w"}" onclick="document.getElementById('rv${j}').scrollIntoView({behavior:'smooth'})">${j+1}</button>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="closeExam();go('examSetup')">Làm đề khác</button><button class="btn ghost" onclick="closeExam()">Trang chủ</button></div>
    </div>
    <h2 style="margin:24px 0 12px">Xem lại bài làm</h2>
    <div class="listq">${E.qs.map((q,j)=>{const a=E.ans[q.id];return `<div class="card" id="rv${j}">
      <div class="qmeta"><span>Câu ${j+1} · ${a===undefined?'<span class="warn">Chưa trả lời</span>':a===q.ans?'<b style="color:var(--ok)">Đúng</b>':'<b style="color:var(--bad)">Sai</b>'}</span><span class="tag">${q.id}</span></div>
      <p class="qtext">${md(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>`<div class="opt ${k===q.ans?"right":k===a?"wrong":""}"><span class="k">${L[k]}</span><span>${md(o)}</span></div>`).join("")}</div>
      <div class="expl"><h4>Giải thích lý thuyết</h4><p>${md(q.ex||"")}</p></div></div>`}).join("")}</div>
  </div>`;
  $("#exam").scrollTop=0;
}
function closeExam(){$("#exam").classList.add("hidden");document.body.style.overflow="";E=null;go("home")}
window.addEventListener("beforeunload",e=>{if(E&&!E.done){e.preventDefault();e.returnValue=""}});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  const k="abcd".indexOf(e.key.toLowerCase()),n="1234".indexOf(e.key),idx=k>=0?k:n;
  if(E&&!E.done&&!$("#exam").classList.contains("hidden")){
    if(idx>=0)pickExam(idx);else if(e.key==="ArrowRight"&&E.i<E.qs.length-1){E.i++;renderExam()}else if(e.key==="ArrowLeft"&&E.i>0){E.i--;renderExam()}
  }else if(S.list&&document.querySelector(".qtext")&&S.mode!=="read"){
    if(idx>=0)pickStudy(idx);else if(e.key==="ArrowRight")nextStudy();else if(e.key==="ArrowLeft"&&S.i>0){S.i--;renderStudy()}
  }
});
home();
</script>
</body>
</html>
